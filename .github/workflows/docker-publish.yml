name: Build and Push to GHCR

on:
  push:
    branches:
      - main # O master, a seconda di come si chiama il tuo branch principale

env:
  REGISTRY: ghcr.io
  # Crea automaticamente il percorso corretto (ghcr.io/tuo-utente/mygarage)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permesso fondamentale per scrivere nell'Artifact Manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.env.REGISTRY }}
          username: ${{ github.actor }}
          # Utilizza un token temporaneo autogenerato da GitHub
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.env.REGISTRY }}/${{ env.env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
